# /etc/nginx/sites-available/spotcredit.org
# Symlink: ln -s /etc/nginx/sites-available/spotcredit.org /etc/nginx/sites-enabled/
#
# SSL is terminated at Cloudflare (Flexible mode). Nginx serves HTTP only.
# Cloudflare → VPS is HTTP; browser → Cloudflare is HTTPS.

# Rate limiting: 60 req/min per real client IP, burst of 20
limit_req_zone  $binary_remote_addr  zone=main:10m  rate=60r/m;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

# ── www → canonical ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.spotcredit.org;
    return 301 http://spotcredit.org$request_uri;
}

# ── Main ───────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name spotcredit.org;

    root  /var/www/spotcredit;
    index index.html;

    server_tokens off;

    # ── Real client IP (behind Cloudflare) ────────────────────────────────────────
    # Traffic reaches this server only through Cloudflare, so $binary_remote_addr
    # is the edge IP unless it is rewritten here. The rate/connection limits and
    # the access log below all depend on this being the real visitor.
    #
    # Ranges fetched from cloudflare.com/ips-v4 + /ips-v6 on 2026-09-06.
    # Re-check quarterly — Cloudflare does add ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # CF-Connecting-IP carries a single address, so real_ip_recursive is a no-op
    # here — it would only matter if this were switched to X-Forwarded-For.
    real_ip_header CF-Connecting-IP;

    # ── Rate / connection limits ──────────────────────────────────────────────
    limit_req  zone=main burst=20 nodelay;
    limit_conn conn 10;

    # ── Request limits ────────────────────────────────────────────────────────
    client_max_body_size   1k;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      30s;
    send_timeout           10s;

    # ── Block everything except GET / HEAD ───────────────────────────────────
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;
    # CSP: external deps are Chart.js (cdnjs) + Google Fonts only; no backend calls
    add_header Content-Security-Policy    "default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none';" always;
    add_header Cache-Control              "no-cache"                                     always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip      on;
    gzip_vary on;
    gzip_types text/html;

    # ── Routing ───────────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    # Block dotfiles and sensitive extensions
    location ~ /\. {
        deny all;
    }
    location ~* \.(git|env|htaccess|htpasswd|bak|sql|log)$ {
        deny all;
    }

    access_log /var/log/nginx/spotcredit.access.log;
    error_log  /var/log/nginx/spotcredit.error.log warn;
}
